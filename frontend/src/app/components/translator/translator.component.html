<div class="min-h-screen bg-gray-50 dark:bg-gray-900 flex items-center justify-center p-6 transition-colors">
  <div class="w-full max-w-3xl bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-8 transition-colors">
    <div class="flex items-start justify-between mb-1">
      <div>
        <h1 class="text-2xl font-semibold text-gray-800 dark:text-gray-100">Corporate Diplomat</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Translate between casual and corporate-speak in seconds.</p>
      </div>
      <button (click)="toggleTheme()" [title]="darkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
              class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-100 dark:bg-gray-700 hover:bg-violet-100 dark:hover:bg-gray-600 hover:text-violet-700 dark:hover:text-violet-300 text-gray-600 dark:text-gray-300 transition">
        <svg *ngIf="!darkMode()" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
        <svg *ngIf="darkMode()" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
      </button>
    </div>

    <div class="mb-6 mt-6 flex justify-center space-x-2 bg-gray-100 dark:bg-gray-700 rounded-full p-1">
      <button (click)="setDirection('casual_to_corporate')"
              [class.bg-violet-600]="direction() === 'casual_to_corporate'"
              [class.text-white]="direction() === 'casual_to_corporate'"
              [class.dark:bg-violet-600]="direction() === 'casual_to_corporate'"
              class="flex-1 px-4 py-2 rounded-full text-sm font-medium transition">
        Make it Corporate
      </button>
      <button (click)="setDirection('corporate_to_casual')"
              [class.bg-violet-600]="direction() === 'corporate_to_casual'"
              [class.text-white]="direction() === 'corporate_to_casual'"
              [class.dark:bg-violet-600]="direction() === 'corporate_to_casual'"
              class="flex-1 px-4 py-2 rounded-full text-sm font-medium transition">
        Make it Casual
      </button>
    </div>

    <div class="flex items-start space-x-3 mb-4">
      <div class="flex-1">
        <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Input</label>
        <textarea [value]="inputText()" (input)="onInput($event)" placeholder="Enter text here..."
                  rows="6" class="w-full p-3 border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 rounded-xl text-sm resize-none focus:outline-none focus:ring-2 focus:ring-violet-500 transition-colors"></textarea>
      </div>
      <button (click)="swap()" title="Swap (move output to input)"
              class="mt-8 w-10 h-10 flex items-center justify-center rounded-full bg-gray-100 dark:bg-gray-700 hover:bg-violet-100 dark:hover:bg-gray-600 hover:text-violet-700 dark:hover:text-violet-300 text-gray-600 dark:text-gray-300 transition">
        ↔
      </button>
    </div>

    <div class="mb-4 flex justify-center items-center space-x-3">
      <button (click)="translate()" [disabled]="loading() || !inputText()"
              class="bg-violet-600 hover:bg-violet-700 text-white rounded-full px-8 py-2.5 text-sm font-medium transition disabled:bg-gray-300 dark:disabled:bg-gray-600 disabled:cursor-not-allowed flex items-center space-x-2">
        <span *ngIf="loading()" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
        <span>{{ loading() ? 'Translating...' : 'Translate' }}</span>
      </button>
      <button (click)="translate()" [disabled]="loading() || !outputText()"
              title="Regenerate translation"
              class="bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 hover:bg-violet-100 dark:hover:bg-gray-600 hover:text-violet-700 dark:hover:text-violet-300 text-gray-600 dark:text-gray-200 rounded-full px-4 py-2.5 text-sm font-medium transition disabled:opacity-40 disabled:cursor-not-allowed flex items-center space-x-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v6h6M20 20v-6h-6M4 10a8 8 0 0114-3M20 14a8 8 0 01-14 3"/>
        </svg>
        <span>Regenerate</span>
      </button>
    </div>

    <div class="relative">
      <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Output</label>
      <textarea [value]="outputText()" readonly placeholder="Translation will appear here..."
                rows="6" class="w-full p-3 border border-gray-200 dark:border-gray-600 rounded-xl text-sm resize-none bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 transition-colors"></textarea>
      <button (click)="copy()" [disabled]="!outputText()" title="Copy to clipboard"
              class="absolute top-8 right-3 w-8 h-8 flex items-center justify-center rounded-lg bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-600 transition disabled:opacity-40">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-500 dark:text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"/>
        </svg>
      </button>
    </div>

    <div *ngIf="error()" class="mt-4 px-4 py-3 rounded-xl bg-red-50 dark:bg-red-900/30 text-red-700 dark:text-red-300 text-sm">{{ error() }}</div>
    <div *ngIf="notes()" class="mt-4 px-4 py-3 rounded-xl bg-violet-50 dark:bg-violet-900/30 text-violet-700 dark:text-violet-300 text-sm">{{ notes() }}</div>
  </div>
</div>
