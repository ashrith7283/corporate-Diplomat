services:
  - type: web
    name: corporate-diplomat-backend
    runtime: docker
    rootDir: .
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://corporate-diplomat-frontend.onrender.com
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: web
    name: corporate-diplomat-frontend
    runtime: docker
    rootDir: .
    dockerfilePath: frontend/Dockerfile
    plan: free
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: BACKEND_URL
        value: http://corporate-diplomat-backend:8000
